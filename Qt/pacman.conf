# pacman (Debian's) pointed at MSYS2's UCRT64 repo, installing into /sysroot.
[options]
RootDir     = /sysroot/
DBPath      = /sysroot/var/lib/pacman/
CacheDir    = /tmp/pacman-cache/
LogFile     = /tmp/pacman.log
GPGDir      = /etc/pacman-msys2.d/gnupg/
HookDir     = /etc/pacman-msys2.d/hooks/
Architecture = auto
SigLevel    = Required DatabaseOptional
ParallelDownloads = 8

[ucrt64]
Server = https://repo.msys2.org/mingw/ucrt64
